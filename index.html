<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5">
<title>LifeBill · 生活账单</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#191919;--muted:#8b8b88;--line:#ececea;--green:#177245;--red:#c94b4b;--shadow:0 8px 30px rgba(0,0,0,.06);--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1100px;margin:auto;padding:28px 22px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-weight:800;font-size:23px;letter-spacing:-.5px}.brand span{font-weight:400;color:var(--muted)}.month{display:flex;align-items:center;gap:8px}.month button,.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}.month strong{min-width:88px;text-align:center}.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:16px}.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.balance{min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font-size:13px;color:var(--muted)}.balance .num{font-size:39px;font-weight:800;letter-spacing:-1.5px;margin-top:7px}.delta{font-size:13px;color:var(--muted)}.income .num{color:var(--green)}.expense .num{color:var(--red)}.num{font-size:27px;font-weight:750;margin-top:18px}.quick{display:flex;gap:10px;margin:18px 0}.quick button{flex:1;padding:15px;border-radius:16px;background:#191919;color:white;font-weight:700}.quick button.secondary{background:white;color:#191919;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sectionhead h2{font-size:18px;margin:0}.sectionhead button{background:none;color:var(--muted);font-size:13px}.bars{height:190px;display:flex;align-items:end;gap:8px;padding:12px 4px 0}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:#242424;min-height:3px}.barlabel{font-size:10px;color:var(--muted)}.cat{display:flex;align-items:center;gap:12px;margin:15px 0}.caticon{width:38px;height:38px;border-radius:12px;background:#f2f2ef;display:grid;place-items:center}.catinfo{flex:1}.catname{font-size:14px}.cattrack{height:5px;background:#eee;border-radius:9px;margin-top:7px;overflow:hidden}.cattrack i{display:block;height:100%;background:#555;border-radius:9px}.catamount{font-size:13px;font-weight:650}.transactions{margin-top:16px}.tx{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.tx:last-child{border-bottom:0}.txicon{width:43px;height:43px;border-radius:14px;background:#f3f3f1;display:grid;place-items:center;font-size:19px}.txmain{flex:1}.txmain b{display:block;font-size:14px}.txmain span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.txamount{font-weight:750}.txamount.in{color:var(--green)}.txamount.out{color:var(--red)}.empty{text-align:center;padding:35px;color:var(--muted);font-size:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:end;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.sheet{width:min(560px,100%);background:white;border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet h3{margin:0;font-size:20px}.types{display:flex;background:#f1f1ef;padding:4px;border-radius:14px;margin-bottom:16px}.types button{flex:1;padding:11px;border-radius:11px;background:transparent;color:var(--muted)}.types button.active{background:#fff;color:#191919;box-shadow:0 2px 8px rgba(0,0,0,.07);font-weight:700}.field{margin:12px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafaf8;outline:none}.amountinput{font-size:30px;font-weight:750}.save{width:100%;padding:15px;border-radius:16px;background:#191919;color:white;font-weight:750;margin-top:8px}.danger{color:var(--red)!important}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:4px}.filter{padding:9px 13px;background:#f1f1ef;border-radius:12px;white-space:nowrap;font-size:12px}.filter.active{background:#191919;color:#fff}.footer{text-align:center;color:#aaa;font-size:11px;margin-top:35px}@media(max-width:760px){.app{padding:18px 15px 80px}.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1;min-height:155px}.grid{grid-template-columns:1fr}.card{padding:18px}.balance .num{font-size:34px}.quick{position:sticky;bottom:12px;z-index:5}.quick button{box-shadow:0 8px 24px rgba(0,0,0,.18)}}
</style>
</head><body>
<div class="app">
<header class="top"><div class="brand">LifeBill <span>生活账单</span></div><div class="month"><button onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="changeMonth(1)">›</button></div></header>
<section class="summary"><div class="card balance"><div><div class="eyebrow">本月结余</div><div class="num" id="balance">¥0.00</div></div><div class="delta" id="count">0 笔记录</div></div><div class="card income"><div class="eyebrow">收入</div><div class="num" id="income">¥0.00</div><div class="delta">本月总收入</div></div><div class="card expense"><div class="eyebrow">支出</div><div class="num" id="expense">¥0.00</div><div class="delta">本月总支出</div></div></section>
<div class="quick"><button onclick="openModal('expense')">＋ 记一笔支出</button><button class="secondary" onclick="openModal('income')">＋ 记一笔收入</button></div>
<main class="grid"><section class="card"><div class="sectionhead"><h2>支出趋势</h2><span class="eyebrow">近 7 天</span></div><div class="bars" id="bars"></div></section><section class="card"><div class="sectionhead"><h2>支出分类</h2><button onclick="showAll()">全部</button></div><div id="categories"></div></section></main>
<section class="card transactions"><div class="sectionhead"><h2>最近记录</h2><div class="filters"><button class="filter active" data-filter="all" onclick="setFilter('all',this)">全部</button><button class="filter" data-filter="expense" onclick="setFilter('expense',this)">支出</button><button class="filter" data-filter="income" onclick="setFilter('income',this)">收入</button></div></div><div id="txlist"></div></section>
<div class="footer">数据仅保存在当前设备浏览器中 · LifeBill</div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h3>添加记录</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="types"><button id="typeExpense" onclick="setType('expense')">支出</button><button id="typeIncome" onclick="setType('income')">收入</button></div><div class="field"><label>金额</label><input id="amount" class="amountinput" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal"></div><div class="field"><label>分类</label><select id="category"></select></div><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>备注</label><input id="note" maxlength="80" placeholder="可选，例如：晚餐、工资"></div><button class="save" onclick="saveTx()">保存记录</button></div></div>
<script>
const cats={expense:[['餐饮','🍜'],['交通','🚇'],['购物','🛍️'],['住房','🏠'],['娱乐','🎮'],['医疗','💊'],['日用','🧴'],['其他','📦']],income:[['工资','💰'],['奖金','🎁'],['投资','📈'],['兼职','💼'],['其他','＋']]};
let data=JSON.parse(localStorage.getItem('lifebill-data')||'[]'), view=new Date(), type='expense', filter='all';
const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function render(){let y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=y+'年 '+(m+1)+'月';let rows=data.filter(x=>x.date.startsWith(ym(view)));let inc=rows.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=rows.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);balance.textContent=money(inc-out);income.textContent=money(inc);expense.textContent=money(out);count.textContent=rows.length+' 笔记录';renderBars(rows);renderCats(rows);renderTx(rows)}
function renderBars(rows){let now=new Date(view.getFullYear(),view.getMonth()+1,0), days=[];for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(Math.max(1,now.getDate()-i));days.push(d)}let vals=days.map(d=>rows.filter(x=>x.type==='expense'&&x.date===fmt(d)).reduce((s,x)=>s+x.amount,0)),max=Math.max(...vals,1);bars.innerHTML=days.map((d,i)=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,vals[i]/max*145)}px" title="${money(vals[i])}"></div><div class="barlabel">${d.getMonth()+1}/${d.getDate()}</div></div>`).join('')}
function renderCats(rows){let map={};rows.filter(x=>x.type==='expense').forEach(x=>map[x.category]=(map[x.category]||0)+x.amount);let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]),total=arr.reduce((s,x)=>s+x[1],0);categories.innerHTML=arr.length?arr.slice(0,7).map(([n,v])=>{let icon=(cats.expense.find(x=>x[0]===n)||['','📦'])[1];return `<div class="cat"><div class="caticon">${icon}</div><div class="catinfo"><div class="catname">${n}</div><div class="cattrack"><i style="width:${total?v/total*100:0}%"></i></div></div><div class="catamount">${money(v)}</div></div>`}).join(''):'<div class="empty">本月还没有支出</div>'}
function renderTx(rows){let r=rows.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>b.date.localeCompare(a.date)||b.created-b.created);txlist.innerHTML=r.length?r.map(x=>{let list=cats[x.type]||[],icon=(list.find(c=>c[0]===x.category)||['','📦'])[1];return `<div class="tx"><div class="txicon">${icon}</div><div class="txmain"><b>${x.category}${x.note?' · '+esc(x.note):''}</b><span>${x.date}</span></div><div class="txamount ${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'-'}${money(x.amount)}</div></div>`}).join(''):'<div class="empty">暂无记录</div>'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function openModal(t){type=t;modal.classList.add('show');date.value=fmt(new Date());amount.value='';note.value='';setType(t)}
function closeModal(){modal.classList.remove('show')}
function setType(t){type=t;typeExpense.classList.toggle('active',t==='expense');typeIncome.classList.toggle('active',t==='income');category.innerHTML=cats[t].map(x=>`<option value="${x[0]}">${x[1]} ${x[0]}</option>`).join('')}
function saveTx(){let a=Number(amount.value);if(!a||a<0)return alert('请输入有效金额');data.push({id:Date.now(),created:Date.now(),type,amount:a,category:category.value,date:date.value,note:note.value.trim()});localStorage.setItem('lifebill-data',JSON.stringify(data));closeModal();render()}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function showAll(){filter='expense';document.querySelector('[data-filter="expense"]').click();document.querySelector('.transactions').scrollIntoView({behavior:'smooth'})}
render();
</script></body></html>
