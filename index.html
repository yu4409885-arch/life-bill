<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f3"><title>LifeBill · 生活账单</title><style>
:root{--bg:#f6f6f3;--card:#fff;--text:#181818;--muted:#8d8d89;--line:#e9e9e5;--green:#147448;--red:#c84b4b;--accent:#191919;--shadow:0 8px 28px #0000000a;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1120px;margin:auto;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:22px;font-weight:800}.brand small{font-size:12px;font-weight:450;color:var(--muted);margin-left:5px}.actions{display:flex;gap:8px}.round{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:19px}.month{display:flex;align-items:center;gap:7px}.month button{width:34px;height:34px;border-radius:50%;background:#fff}.month b{min-width:82px;text-align:center;font-size:14px}.summary{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:12px}.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.balance{min-height:172px;display:flex;flex-direction:column;justify-content:space-between}.label{font-size:12px;color:var(--muted)}.big{font-size:39px;font-weight:800;letter-spacing:-1.5px;margin-top:8px}.smallnum{font-size:27px;font-weight:800;margin-top:18px}.green{color:var(--green)}.red{color:var(--red)}.hint{font-size:12px;color:var(--muted);margin-top:7px}.quick{display:flex;gap:9px;margin:14px 0}.quick button{flex:1;border-radius:15px;padding:14px;font-weight:750;background:#191919;color:white}.quick .incomeBtn{background:white;color:#191919;box-shadow:var(--shadow)}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h2{font-size:17px;margin:0}.sectionhead span,.link{font-size:12px;color:var(--muted)}.link{background:none}.bars{height:190px;display:flex;gap:7px;align-items:end}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px}.bar{width:min(30px,70%);min-height:3px;border-radius:8px 8px 3px 3px;background:#292929}.bar.today{background:#777}.barlabel{font-size:10px;color:var(--muted)}.cat{display:flex;gap:10px;align-items:center;margin:13px 0}.ico{width:37px;height:37px;border-radius:11px;background:#f1f1ee;display:grid;place-items:center}.catmain{flex:1}.catrow{display:flex;justify-content:space-between;font-size:13px}.track{height:5px;background:#eee;border-radius:9px;margin-top:6px;overflow:hidden}.track i{display:block;height:100%;background:#555;border-radius:9px}.amount{font-size:12px;font-weight:700}.transactions{margin-top:14px}.tabs{display:flex;gap:6px;background:#f0f0ed;padding:4px;border-radius:12px}.tab{background:transparent;padding:8px 11px;border-radius:9px;font-size:12px;color:var(--muted)}.tab.active{background:white;color:#191919;box-shadow:0 2px 7px #0000000b;font-weight:700}.tx{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.txicon{width:43px;height:43px;border-radius:13px;background:#f2f2ef;display:grid;place-items:center;font-size:19px}.txmain{flex:1;min-width:0}.txmain b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.txamt{font-size:14px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:38px 10px;font-size:13px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}.sheet{width:min(570px,100%);background:#fff;border-radius:26px;padding:20px;box-shadow:0 20px 60px #0003}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0;font-size:19px}.close{width:34px;height:34px;border-radius:50%;background:#f2f2ef}.types{display:flex;background:#f0f0ed;padding:4px;border-radius:13px;margin:16px 0}.types button{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted)}.types .active{background:#fff;color:#191919;box-shadow:0 2px 7px #0000000c;font-weight:750}.field{margin:11px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fafaf8;outline:none}.field .amountInput{font-size:29px;font-weight:800}.save{width:100%;padding:14px;border-radius:14px;background:#191919;color:#fff;font-weight:750;margin-top:7px}.more{display:none}.footer{text-align:center;color:#aaa;font-size:10px;margin-top:28px}.searchbox{display:flex;gap:7px;margin-bottom:12px}.searchbox input{flex:1;border:1px solid var(--line);background:#fafaf8;border-radius:12px;padding:10px 12px;outline:none}.budget{margin-top:14px}.budgetrow{display:flex;justify-content:space-between;font-size:12px;margin:9px 0}.progress{height:7px;background:#eee;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#222}.manage{display:none}
@media(max-width:760px){.app{padding:17px 14px 90px}.top{margin-bottom:15px}.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1;min-height:150px}.big{font-size:34px}.layout{grid-template-columns:1fr}.card{padding:17px}.quick{position:sticky;bottom:12px;z-index:10}.quick button{box-shadow:0 8px 25px #0003}.more{display:block}.desktopOnly{display:none}.modal{padding:8px}.sheet{border-radius:24px 24px 18px 18px}}
</style></head><body><div class="app">
<header class="top"><div class="brand">LifeBill <small>生活账单</small></div><div class="month"><button onclick="moveMonth(-1)">‹</button><b id="month"></b><button onclick="moveMonth(1)">›</button></div><div class="actions"><button class="round" onclick="openSearch()">⌕</button></div></header>
<section class="summary"><div class="card balance"><div><div class="label">本月结余</div><div class="big" id="balance">¥0.00</div></div><div class="hint"><span id="recordCount">0</span> 笔记录 · 收入减去支出</div></div><div class="card"><div class="label">本月收入</div><div class="smallnum green" id="income">¥0.00</div><div class="hint">全部收入</div></div><div class="card"><div class="label">本月支出</div><div class="smallnum red" id="expense">¥0.00</div><div class="hint">全部支出</div></div></section>
<div class="quick"><button onclick="openModal('expense')">＋ 记支出</button><button class="incomeBtn" onclick="openModal('income')">＋ 记收入</button></div>
<main class="layout"><section class="card"><div class="sectionhead"><h2>支出趋势</h2><span>最近 7 天</span></div><div class="bars" id="bars"></div></section><section class="card"><div class="sectionhead"><h2>支出分类</h2><button class="link" onclick="showExpense()">查看全部</button></div><div id="categories"></div><div class="budget"><div class="sectionhead"><h2>本月预算</h2><button class="link" onclick="editBudget()">设置</button></div><div class="budgetrow"><span id="budgetText">未设置预算</span><b id="budgetPct"></b></div><div class="progress"><i id="budgetBar" style="width:0%"></i></div></div></section></main>
<section class="card transactions"><div class="sectionhead"><h2>账单明细</h2><div class="tabs"><button class="tab active" onclick="setFilter('all',this)">全部</button><button class="tab" onclick="setFilter('expense',this)">支出</button><button class="tab" onclick="setFilter('income',this)">收入</button></div></div><div class="searchbox" id="searchbox" style="display:none"><input id="search" placeholder="搜索分类或备注" oninput="renderTx()"><button class="close" onclick="closeSearch()">×</button></div><div id="txlist"></div></section><div class="footer">LifeBill · 数据保存在当前浏览器</div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">添加记录</h3><button class="close" onclick="closeModal()">×</button></div><div class="types"><button id="expenseType" onclick="setType('expense')">支出</button><button id="incomeType" onclick="setType('income')">收入</button></div><div class="field"><label>金额</label><input id="amount" class="amountInput" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal"></div><div class="field"><label>分类</label><select id="category"></select></div><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>备注</label><input id="note" maxlength="100" placeholder="例如：晚餐、工资、房租"></div><button class="save" onclick="saveTx()">保存记录</button></div></div>
<script>
const C={expense:[['餐饮','🍜'],['交通','🚇'],['购物','🛍️'],['住房','🏠'],['娱乐','🎮'],['医疗','💊'],['日用','🧴'],['教育','📚'],['其他','📦']],income:[['工资','💰'],['奖金','🎁'],['投资','📈'],['兼职','💼'],['退款','↩️'],['其他','＋']]};
let data=JSON.parse(localStorage.getItem('lifebill-data')||'[]'),budget=Number(localStorage.getItem('lifebill-budget')||0),view=new Date(),type='expense',filter='all';
const $=id=>document.getElementById(id), fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, ym=d=>fmt(d).slice(0,7), money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){const rows=data.filter(x=>x.date.startsWith(ym(view)));const inc=rows.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=rows.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);$('month').textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;$('balance').textContent=money(inc-out);$('income').textContent=money(inc);$('expense').textContent=money(out);$('recordCount').textContent=rows.length;renderBars(rows);renderCats(rows);renderTx();renderBudget(out)}
function renderBars(rows){let last=new Date(view.getFullYear(),view.getMonth()+1,0),ds=[];for(let i=6;i>=0;i--){let d=new Date(last);d.setDate(Math.max(1,last.getDate()-i));ds.push(d)}let vs=ds.map(d=>rows.filter(x=>x.type==='expense'&&x.date===fmt(d)).reduce((s,x)=>s+x.amount,0)),mx=Math.max(...vs,1);$('bars').innerHTML=ds.map((d,i)=>`<div class="barwrap"><div class="bar ${i===6?'today':''}" style="height:${Math.max(3,vs[i]/mx*145)}px" title="${money(vs[i])}"></div><div class="barlabel">${d.getMonth()+1}/${d.getDate()}</div></div>`).join('')}
function renderCats(rows){let map={};rows.filter(x=>x.type==='expense').forEach(x=>map[x.category]=(map[x.category]||0)+x.amount);let a=Object.entries(map).sort((x,y)=>y[1]-x[1]),total=a.reduce((s,x)=>s+x[1],0);$('categories').innerHTML=a.length?a.slice(0,6).map(([n,v])=>{let icon=(C.expense.find(x=>x[0]===n)||['','📦'])[1];return `<div class="cat"><div class="ico">${icon}</div><div class="catmain"><div class="catrow"><span>${n}</span><b>${money(v)}</b></div><div class="track"><i style="width:${total?v/total*100:0}%"></i></div></div></div>`}).join(''):'<div class="empty">本月还没有支出</div>'}
function renderTx(){let rows=data.filter(x=>x.date.startsWith(ym(view))&& (filter==='all'||x.type===filter));let q=($('search')?.value||'').trim().toLowerCase();if(q)rows=rows.filter(x=>(x.category+x.note).toLowerCase().includes(q));rows.sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);$('txlist').innerHTML=rows.length?rows.map(x=>{let icon=(C[x.type].find(c=>c[0]===x.category)||['','📦'])[1];return `<div class="tx"><div class="txicon">${icon}</div><div class="txmain"><b>${esc(x.category)}${x.note?' · '+esc(x.note):''}</b><span>${x.date}</span></div><div class="txamt ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`}).join(''):'<div class="empty">暂无记录</div>'}
function renderBudget(out){$('budgetText').textContent=budget?`${money(out)} / ${money(budget)}`:'未设置预算';let p=budget?Math.min(out/budget*100,100):0;$('budgetPct').textContent=budget?Math.round(out/budget*100)+'%':'';$('budgetBar').style.width=p+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
function openModal(t){$('modal').classList.add('show');$('date').value=fmt(new Date());$('amount').value='';$('note').value='';setType(t);$('modalTitle').textContent=t==='expense'?'记录一笔支出':'记录一笔收入';setTimeout(()=>$('amount').focus(),80)}
function closeModal(){$('modal').classList.remove('show')}
function setType(t){type=t;$('expenseType').classList.toggle('active',t==='expense');$('incomeType').classList.toggle('active',t==='income');$('category').innerHTML=C[t].map(x=>`<option value="${x[0]}">${x[1]} ${x[0]}</option>`).join('')}
function saveTx(){let amount=Number($('amount').value),date=$('date').value;if(!amount||amount<=0||!date)return alert('请填写金额和日期');data.push({id:Date.now(),created:Date.now(),type,amount,category:$('category').value,date,note:$('note').value.trim()});localStorage.setItem('lifebill-data',JSON.stringify(data));closeModal();render()}
function setFilter(f,el){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderTx()}
function showExpense(){let b=document.querySelectorAll('.tab')[1];setFilter('expense',b);$('txlist').scrollIntoView({behavior:'smooth',block:'center'})}
function openSearch(){$('searchbox').style.display='flex';$('search').focus()}function closeSearch(){$('searchbox').style.display='none';$('search').value='';renderTx()}
function editBudget(){let v=prompt('设置本月预算（元）',budget||'');if(v===null)return;budget=Math.max(0,Number(v)||0);localStorage.setItem('lifebill-budget',budget);render()}
render();
</script></body></html>
